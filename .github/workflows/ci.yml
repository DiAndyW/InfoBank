name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NOTEBANK_TEST_ADMIN_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Server tests and build
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./... | tee test.log
          python3 -c 'from pathlib import Path; assert "--- PASS:" in Path("test.log").read_text(), "No Go tests ran"'
          go build ./cmd/notebank-server
      - name: Updater tests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 -m unittest discover -s deploy/tests -v
          bash -n deploy/notebank-backup
          sudo install -m 755 deploy/notebank-update deploy/notebank-backup deploy/release-manifest.py /usr/local/sbin/
          systemd-analyze verify deploy/notebank-update.service deploy/notebank-update.timer deploy/notebank-backup.service

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: ./.github/actions/test-services
      - name: Frontend tests and typecheck/build
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Select Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.os }}
          cache-bin: 'false'
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          cargo test --locked | tee rust-tests.log
          python -c 'import re; from pathlib import Path; assert re.search(r"test result: ok\. [1-9][0-9]* passed", Path("rust-tests.log").read_text()), "No Rust tests ran"'
      - name: WebKit binary IPC transport
        if: runner.os == 'macOS'
        run: swift desktop/tests/ipc-transport.swift
      - name: Native application build
        working-directory: desktop
        run: npm run tauri -- build --no-bundle

  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-services
      - name: Kit tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path ios/NoteBankKit --no-parallel 2>&1 | tee kit-tests.log
          python3 -c 'import re; from pathlib import Path; assert re.search(r"[1-9][0-9]* tests? (?:in .* )?passed", Path("kit-tests.log").read_text()), "No Kit tests ran"'
      - name: iPhone simulator build
        run: >-
          xcodebuild -project ios/NoteBank.xcodeproj -scheme NoteBank
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  behaviour:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Shared behaviour validation and tests
        run: |
          python3 -m unittest behaviour.test_check -v
          python3 behaviour/check.py

  checks:
    if: always()
    needs: [server, desktop, apple, behaviour]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every mandatory job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'server', 'desktop', 'apple', 'behaviour'}
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
