name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$RELEASE_REF" = refs/heads/main
          else
            python3 deploy/desktop-release.py check-version "$RELEASE_TAG"
            git merge-base --is-ancestor HEAD origin/main
          fi

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    environment: desktop-release
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Select Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          if [[ "$RUNNER_OS" == macOS ]]; then
            rustup target add aarch64-apple-darwin
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.os }}
          cache-bin: 'false'
      - run: npm ci
      - name: Build and verify Mac release
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_file"
          unset APPLE_API_PRIVATE_KEY
          export APPLE_API_KEY_PATH="$key_file"
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin --bundles app,dmg
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg=${dmgs[0]}
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t exec "$bundle/macos/NoteBank.app"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          xcrun stapler validate "$bundle/macos/NoteBank.app"
          xcrun stapler validate "$dmg"
          mkdir release-assets
          cp "$bundle/macos/NoteBank.app.tar.gz" "$bundle/macos/NoteBank.app.tar.gz.sig" "$dmg" release-assets/
      - name: Build Windows release
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
          mkdir release-assets
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(release-assets/*-setup.exe)
          test "${#windows[@]}" -eq 1
          python3 deploy/desktop-release.py manifest --version "${TAG#desktop-v}" \
            --mac-asset NoteBank.app.tar.gz --mac-sig release-assets/NoteBank.app.tar.gz.sig \
            --windows-asset "$(basename "${windows[0]}")" --windows-sig "${windows[0]}.sig" > latest.json
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes "Desktop release; CI checks passed." release-assets/* latest.json
          # Installed apps find updates through the latest release.
          gh release edit "$TAG" --draft=false --latest=true
