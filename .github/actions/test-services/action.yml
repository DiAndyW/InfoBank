name: Native test services
description: Configure Go and an isolated loopback Postgres cluster for native integration tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - name: Locate Postgres tools
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == macOS ]]; then
          brew install postgresql@17
          pg_bin="$(brew --prefix postgresql@17)/bin"
        elif [[ "$RUNNER_OS" == Windows ]]; then
          pg_bin="${PGBIN:?The Windows runner must provide PGBIN}"
        else
          echo "Unsupported native test runner: $RUNNER_OS" >&2
          exit 1
        fi
        printf '%s\n' "$pg_bin" >> "$GITHUB_PATH"
        printf 'PGBIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
    - name: Start test Postgres
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        import subprocess

        suffix = '.exe' if os.name == 'nt' else ''
        pg_bin = Path(os.environ['PGBIN'])
        data = Path(os.environ['RUNNER_TEMP']) / 'notebank-test-postgres'
        log = Path(os.environ['RUNNER_TEMP']) / 'notebank-test-postgres.log'
        subprocess.run([str(pg_bin / ('initdb' + suffix)), '-D', str(data),
                        '-U', 'postgres', '--auth=trust', '--encoding=UTF8', '--locale=C'], check=True)
        subprocess.run([str(pg_bin / ('pg_ctl' + suffix)), '-D', str(data), '-l', str(log),
                        '-o', '-h 127.0.0.1 -p 55432 -F', '-w', 'start'], check=True)
        url = 'postgres://postgres@127.0.0.1:55432/postgres?sslmode=disable'
        subprocess.run([str(pg_bin / ('psql' + suffix)), url, '-v', 'ON_ERROR_STOP=1',
                        '-qc', 'SELECT 1'], check=True)
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            env.write(f'NOTEBANK_TEST_ADMIN_URL={url}\n')
        PY
