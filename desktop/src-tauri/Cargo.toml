[package]
name = "notebank"
version = "0.1.0"
description = "NoteBank desktop"
authors = ["Andy Wang"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which clashes on Windows (rust-lang/cargo#8519).
name = "notebank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2.5"
keyring-core = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util"] }
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
percent-encoding = "2"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
